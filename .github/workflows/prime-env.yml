name: prime-env

# Model-free check of the Prime Intellect verifiers taskset in prime_env/: on every change, the key must pass its
# grader and an untouched workspace must not (vf-validate, Docker runtime). Publishing to the Environments Hub runs
# only on a tag env-v*, and only if the PRIME_API_KEY secret exists (it needs the owner's Prime account).

on:
  push:
    branches: [main]
    tags: ["env-v*"]   # paths filters are not evaluated for tag pushes
    paths: ["prime_env/**", ".github/workflows/prime-env.yml"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    defaults:
      run:
        working-directory: prime_env
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - name: Install verifiers 0.4.0 and the taskset
        run: uv venv --python 3.12 && uv pip install "verifiers==0.4.0" -e .
      - name: Resolve the configuration (no rows, no sandbox)
        run: uv run vf-eval silicyte-bio-evals-env --env.agent.harness.id bash --env.agent.runtime.type docker --no-push --dry-run
      - name: Gold passes and an untouched workspace fails, on all four tasks
        run: uv run vf-validate silicyte-bio-evals-env --runtime.type docker

  publish:
    if: startsWith(github.ref, 'refs/tags/env-v')
    needs: validate
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: prime_env
    env:
      PRIME_API_KEY: ${{ secrets.PRIME_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: test -n "$PRIME_API_KEY" || { echo "PRIME_API_KEY secret is not set"; exit 1; }
      - run: uv tool install prime
      - run: prime env push --path . --visibility PUBLIC
